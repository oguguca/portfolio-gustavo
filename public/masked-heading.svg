<svg width="1800" height="600" viewBox="0 0 1800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Gradiente principal -->
    <linearGradient id="mainGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8F4FF"></stop>
      <stop offset="24%" stop-color="#FFFFFF"></stop>
      <stop offset="42%" stop-color="#E7C6FF"></stop>
      <stop offset="60%" stop-color="#C875FF"></stop>
      <stop offset="78%" stop-color="#A84DFF"></stop>
      <stop offset="100%" stop-color="#6E27C8"></stop>
    </linearGradient>

    <!-- Glow esquerdo -->
    <radialGradient id="glowLeft">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"></stop>

      <stop offset="12%" stop-color="#F2DCFF" stop-opacity="0.95"></stop>

      <stop offset="35%" stop-color="#C875FF" stop-opacity="0.55"></stop>

      <stop offset="100%" stop-color="#7C2CDA" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Glow central -->
    <radialGradient id="glowCenter">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>

      <stop offset="18%" stop-color="#E9C8FF" stop-opacity="0.8"></stop>

      <stop offset="42%" stop-color="#A94DFF" stop-opacity="0.45"></stop>

      <stop offset="100%" stop-color="#5227FF" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Glow direito -->
    <radialGradient id="glowRight">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"></stop>

      <stop offset="14%" stop-color="#F1D5FF" stop-opacity="0.95"></stop>

      <stop offset="40%" stop-color="#BD68FF" stop-opacity="0.55"></stop>

      <stop offset="100%" stop-color="#5227FF" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Reflexo metálico -->
    <linearGradient id="metalHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"></stop>

      <stop offset="43%" stop-color="#FFFFFF" stop-opacity="0"></stop>

      <stop offset="49%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>

      <stop offset="52%" stop-color="#E9C8FF" stop-opacity="0.75"></stop>

      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0"></stop>

      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>

    <!-- Blur -->
    <filter id="blurLarge">
      <feGaussianBlur stdDeviation="45"></feGaussianBlur>
    </filter>

    <filter id="blurMedium">
      <feGaussianBlur stdDeviation="22"></feGaussianBlur>
    </filter>

  </defs>

  <!-- Base -->
  <rect width="1800" height="600" fill="url(#mainGradient)"></rect>

  <!-- Mancha esquerda -->
  <ellipse cx="430" cy="260" rx="310" ry="220" fill="url(#glowLeft)" filter="url(#blurMedium)"></ellipse>

  <!-- Mancha central -->
  <ellipse cx="930" cy="190" rx="330" ry="190" fill="url(#glowCenter)" filter="url(#blurLarge)"></ellipse>

  <!-- Mancha direita -->
  <ellipse cx="1470" cy="340" rx="360" ry="230" fill="url(#glowRight)" filter="url(#blurMedium)"></ellipse>

  <!-- Reflexo metálico diagonal -->
  <rect x="-250" y="0" width="2300" height="600" fill="url(#metalHighlight)" transform="rotate(-8 900 300)" opacity="0.85"></rect>

  <!-- Reflexo fino 1 -->
  <ellipse cx="680" cy="410" rx="170" ry="12" fill="#FFFFFF" opacity="0.32" filter="url(#blurMedium)" transform="rotate(-18 680 410)"></ellipse>

  <!-- Reflexo fino 2 -->
  <ellipse cx="1360" cy="170" rx="130" ry="10" fill="#FFFFFF" opacity="0.38" filter="url(#blurMedium)" transform="rotate(-23 1360 170)"></ellipse>

</svg>